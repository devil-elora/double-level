<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DOUBLE LEVEL · ADMIN</title>
<style>
  :root{ --bg:#0b0b0f; --panel:#15151c; --panel2:#1d1d26; --line:#2a2a36; --txt:#ececf2; --txt2:#9a9aab; --txt3:#6a6a78; --accent:#ffffff; --ok:#39d98a; --err:#ff6b6b; --r:12px; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI",system-ui,sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased; }
  a{ color:#9db4ff; }
  .wrap{ max-width:720px; margin:0 auto; padding:48px 20px 80px; }
  .brand{ font-weight:800; letter-spacing:4px; font-size:14px; color:var(--txt2); }
  h1{ font-size:22px; font-weight:700; margin:6px 0 2px; letter-spacing:.5px; }
  .sub{ color:var(--txt3); font-size:12px; letter-spacing:1.5px; margin-bottom:28px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:22px; margin-bottom:18px; }
  label{ display:block; font-size:13px; color:var(--txt2); margin:14px 0 6px; }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=password], input[type=url], select, textarea{ width:100%; height:42px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; color:var(--txt); padding:0 12px; font-size:14px; font-family:inherit; outline:none; }
  textarea{ height:auto; padding:10px 12px; resize:vertical; }
  input:focus, select:focus{ border-color:#5a5a6e; }
  input[type=file]{ font-size:13px; color:var(--txt2); }
  .row{ display:flex; gap:12px; flex-wrap:wrap; }
  .row > div{ flex:1; min-width:160px; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line); border-radius:20px; padding:7px 14px; font-size:13px; cursor:pointer; user-select:none; }
  .chip input{ accent-color:var(--accent); }
  button{ font-family:inherit; cursor:pointer; }
  .btn{ height:44px; padding:0 20px; background:var(--accent); color:#000; border:0; border-radius:9px; font-size:14px; font-weight:700; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn.ghost{ background:transparent; color:var(--txt); border:1px solid var(--line); }
  .tabs{ display:flex; gap:6px; margin-bottom:18px; }
  .tabs button{ flex:1; height:40px; background:var(--panel); border:1px solid var(--line); border-radius:9px; color:var(--txt2); font-size:13.5px; font-weight:600; }
  .tabs button.on{ background:var(--panel2); color:var(--txt); border-color:#45455a; }
  .hide{ display:none; }
  .msg{ font-size:13px; margin-top:12px; min-height:18px; }
  .msg.ok{ color:var(--ok); }
  .msg.err{ color:var(--err); white-space:pre-wrap; }
  .note{ font-size:12.5px; color:var(--txt3); line-height:1.6; }
  .note code{ background:var(--panel2); padding:1px 6px; border-radius:5px; color:var(--txt2); }
  .drop{ position:relative; border:1.5px dashed var(--line); border-radius:10px; background:var(--panel2); padding:14px 16px; cursor:pointer; transition:border-color .15s, background .15s; margin-bottom:16px; }
  .drop:hover{ border-color:#45455a; }
  .drop:focus{ outline:none; border-color:#5a5a6e; }
  .drop.drag{ border-color:#8a8aa2; background:#23232e; }
  .drop-prompt{ text-align:center; }
  .drop-main{ font-size:13.5px; color:var(--txt2); }
  .drop-main b{ color:var(--txt); font-weight:700; }
  .drop-sub{ font-size:11.5px; color:var(--txt3); margin-top:3px; }
  .drop code{ background:var(--bg); padding:1px 6px; border-radius:5px; color:var(--txt2); font-size:12px; }
  .drop-preview{ display:flex; align-items:center; gap:12px; }
  .drop-preview img{ width:52px; height:52px; object-fit:cover; border-radius:7px; border:1px solid var(--line); flex:0 0 auto; }
  .pv-name{ font-size:13px; color:var(--txt); word-break:break-all; }
  .pv-sub{ font-size:11.5px; color:var(--txt3); margin-top:2px; }
  .pv-del{ margin-left:auto; flex:0 0 auto; }
  .list-item{ display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); font-size:14px; }
  .list-item:first-child{ border-top:0; }
  .list-item .r{ color:var(--txt3); font-size:12.5px; margin-left:auto; }
  .topbar{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .topbar .r{ margin-left:auto; display:flex; gap:10px; }
  .link{ background:none; border:0; color:var(--txt3); font-size:12.5px; text-decoration:underline; padding:0; }
  .q{ font-size:14px; color:var(--txt); margin:14px 0 6px; }
  .spin{ display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus{ -webkit-text-fill-color:var(--txt); -webkit-box-shadow:0 0 0 1000px var(--panel2) inset; caret-color:var(--txt); }
  .wrap:has(#gate:not(.hide)){ min-height:100dvh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:40px 20px 12vh; }
  .wrap:has(#gate:not(.hide)) .sub{ margin-bottom:0; }
  .gate-card{ width:100%; max-width:400px; margin:30px 0 0; padding:26px; }
  .gate-card input{ letter-spacing:3px; text-align:center; }
  .gate-card .msg:empty{ display:none; }
  .gate-btn{ width:100%; margin-top:18px; }
  .find-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .find-row .btn.ghost{ height:38px; padding:0 14px; font-size:13px; }
  .cands{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .cand{ display:flex; align-items:center; gap:10px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 10px; }
  .cand.sel{ border-color:#6f8cff; }
  .cand-play{ width:30px; height:30px; border-radius:50%; background:var(--accent); color:#000; border:0; font-size:10px; flex:0 0 auto; }
  .cand-info{ flex:1; min-width:0; }
  .cand-track{ font-size:13px; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cand-sub{ font-size:11.5px; color:var(--txt3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cand-pick{ font-size:12px; padding:5px 12px; border-radius:7px; background:transparent; color:var(--txt2); border:1px solid var(--line); flex:0 0 auto; }
  .cand.sel .cand-pick{ background:var(--accent); color:#000; border-color:var(--accent); font-weight:700; }
  .subtabs{ display:flex; gap:6px; margin-bottom:16px; }
  .subtab{ flex:1; height:36px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; color:var(--txt3); font-size:13px; font-weight:600; }
  .subtab.on{ background:var(--accent); color:#000; border-color:var(--accent); }
  .list-item .del{ margin-left:12px; flex:0 0 auto; background:transparent; border:1px solid var(--line); color:var(--txt3); font-size:12px; padding:4px 11px; border-radius:7px; }
  .list-item .del:hover{ border-color:var(--err); color:var(--err); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">DOUBLE LEVEL</div>
  <h1>ADMIN</h1>
  <div class="sub">ROSTER &amp; DISCOGRAPHY MANAGEMENT</div>

  <!-- ========== 1. 잠금 ========== -->
  <section id="gate" class="card gate-card">
    <label>접속 코드</label>
    <input type="password" id="g-code" autocomplete="off" placeholder="••••••••">
    <button class="btn gate-btn" id="g-btn">입장</button>
    <div class="msg err" id="g-msg"></div>
  </section>

  <!-- ========== 2. 관리 ========== -->
  <section id="app" class="hide">
    <div class="topbar">
      <div class="note" id="repo-state"></div>
      <div class="r">
        <button class="link" id="logout">잠그기</button>
      </div>
    </div>

    <div class="tabs">
      <button data-tab="producer" class="on">ROSTER 추가</button>
      <button data-tab="song">DISCOGRAPHY 추가</button>
      <button data-tab="list">현재 목록</button>
    </div>

    <!-- 프로듀서 -->
    <div class="card tabpane" data-pane="producer">
      <div class="row">
        <div><label>이름 *</label><input type="text" id="p-name" placeholder="Earcandy"></div>
        <div><label>역할 *</label>
          <select id="p-role">
            <option value="Producer">프로듀서 (Producer)</option>
            <option value="Songwriter">작사가 (Songwriter)</option>
            <option value="Topliner">탑라이너 (Topliner)</option>
            <option value="__custom">직접 입력…</option>
          </select>
          <input type="text" id="p-role-custom" class="hide" placeholder="역할 직접 입력" style="margin-top:8px">
        </div>
      </div>
      <label>사진 * (자동으로 긴 변 1200px JPG 로 변환)</label>
      <div class="drop" id="p-drop" tabindex="0">
        <input type="file" id="p-photo" accept="image/*" class="hide">
        <div class="drop-prompt">
          <div class="drop-main"><b>파일 선택</b> · 끌어다 놓기 · <code>Ctrl+V</code> 붙여넣기</div>
          <div class="drop-sub">PNG · JPG · WEBP</div>
        </div>
        <div class="drop-preview hide"></div>
      </div>
      <div class="row">
        <div><label>본명 (선택)</label><input type="text" id="p-ko" placeholder="Kim Kang San"></div>
        <div><label>인스타그램 URL (선택)</label><input type="url" id="p-insta" placeholder="https://www.instagram.com/…"></div>
      </div>
      <label>위치</label>
      <select id="p-pos"><option value="__end">맨 끝에 추가</option></select>
      <div style="margin-top:18px"><button class="btn" id="p-submit">사이트에 추가</button></div>
      <div class="msg" id="p-msg"></div>
    </div>

    <!-- 음원 -->
    <div class="card tabpane hide" data-pane="song">
      <div class="row">
        <div><label>아티스트 *</label><input type="text" id="s-artist" placeholder="NCT WISH"></div>
        <div><label>곡 제목 *</label><input type="text" id="s-title" placeholder="If You Love Me Let Me Know"></div>
      </div>
      <label>앨범 *</label><input type="text" id="s-album" placeholder="앨범명">
      <label>크레딧 * (더블레벨이 맡은 일)</label>
      <div class="chips">
        <label class="chip"><input type="checkbox" value="Lyrics"> 작사 (Lyrics)</label>
        <label class="chip"><input type="checkbox" value="Composition"> 작곡 (Composition)</label>
        <label class="chip"><input type="checkbox" value="Arrangement"> 편곡 (Arrangement)</label>
      </div>
      <label>커버 이미지 (선택)</label>
      <div class="drop" id="s-drop" tabindex="0">
        <input type="file" id="s-cover" accept="image/*" class="hide">
        <div class="drop-prompt">
          <div class="drop-main"><b>파일 선택</b> · 끌어다 놓기 · <code>Ctrl+V</code> 붙여넣기</div>
          <div class="drop-sub">PNG · JPG · WEBP</div>
        </div>
        <div class="drop-preview hide"></div>
      </div>
      <label>미리듣기 (아티스트·곡 제목으로 iTunes 자동 검색)</label>
      <div class="find-row">
        <button type="button" class="btn ghost" id="s-find">iTunes에서 미리듣기 찾기</button>
        <span class="note" id="s-find-msg"></span>
      </div>
      <div id="s-cands" class="cands hide"></div>
      <input type="url" id="s-preview" placeholder="자동으로 채워집니다 · 직접 붙여넣어도 됨" style="margin-top:8px">
      <div style="margin-top:18px"><button class="btn" id="s-submit">사이트에 추가</button></div>
      <div class="msg" id="s-msg"></div>
    </div>

    <!-- 목록 -->
    <div class="card tabpane hide" data-pane="list">
      <div class="subtabs">
        <button type="button" class="subtab on" data-sub="roster" id="sub-roster">ROSTER</button>
        <button type="button" class="subtab" data-sub="disco" id="sub-disco">DISCOGRAPHY</button>
      </div>
      <div id="list-body"><span class="note">불러오는 중…</span></div>
      <div class="msg" id="list-msg"></div>
      <div style="margin-top:14px"><button class="btn ghost" id="list-reload">새로고침</button></div>
    </div>
  </section>

</div>

<script>
const PROXY = 'https://dblv-claude-proxy.vercel.app/api/admin';
let ADMIN_CODE = '';
const $ = s => document.querySelector(s);

async function api(action, extra){
  const r = await fetch(PROXY, { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ action, code: ADMIN_CODE, ...(extra||{}) }) });
  let d={}; try{ d = await r.json(); }catch(e){}
  if(!r.ok) throw new Error(d.error || (r.status+' '+r.statusText));
  return d;
}

/* ---------- 로그인 (코드) — 들어올 때마다 입력 ---------- */
$('#g-btn').onclick = async () => {
  const code = $('#g-code').value.trim();
  if(!code){ setMsg('#g-msg','err','코드를 입력하세요.'); return; }
  $('#g-btn').disabled = true; setMsg('#g-msg','', '<span class="spin"></span>확인 중…');
  ADMIN_CODE = code;
  try{
    await api('login');
    $('#g-msg').textContent = '';
    $('#gate').classList.add('hide');
    showApp();
  }catch(e){
    ADMIN_CODE = '';
    setMsg('#g-msg','err', /bad code|401/.test(e.message) ? '코드가 맞지 않습니다.' : ('오류: '+e.message));
  }finally{ $('#g-btn').disabled = false; }
};
$('#g-code').addEventListener('keydown', e => { if(e.key==='Enter') $('#g-btn').click(); });

$('#logout').onclick = () => location.reload();

/* ---------- 파일 읽기/쓰기 (서버 경유) ---------- */
async function getFile(path){ const d = await api('read', { path }); return { text: d.text }; }
async function commitFiles(files, message){ const d = await api('commit', { files, message }); return d.sha; }

/* ---------- 유틸 ---------- */
function setMsg(sel, cls, html){ const el=$(sel); el.className='msg '+(cls||''); el.innerHTML=html; }
function slug(s){ return (s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,''); }
function resizeImage(file, max=1200, q=0.88){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{ let w=img.width,h=img.height; const r=Math.min(1,max/Math.max(w,h));
      const cw=Math.max(1,Math.round(w*r)), ch=Math.max(1,Math.round(h*r));
      const c=document.createElement('canvas'); c.width=cw; c.height=ch;
      c.getContext('2d').drawImage(img,0,0,cw,ch);
      c.toBlob(b=>{ const fr=new FileReader(); fr.onload=()=>resolve(fr.result.split(',')[1]); fr.onerror=reject; fr.readAsDataURL(b); },'image/jpeg',q);
    };
    img.onerror=()=>reject(new Error('이미지를 읽지 못했습니다.'));
    const fr=new FileReader(); fr.onload=()=>img.src=fr.result; fr.onerror=reject; fr.readAsDataURL(file);
  });
}
function bumpVersion(html){
  const m = html.match(/site-data\.js\?v=(\d+)/);
  if(!m) return html;
  const from=m[1], to=String(parseInt(from,10)+1);
  return html.split('?v='+from).join('?v='+to);
}
function insertAtArrayEnd(text, key, entry){
  const si = text.indexOf(key+':');
  const rest = text.slice(si);
  const m = rest.match(/\n([ \t]*)\],/);
  const pos = si + m.index;
  return text.slice(0,pos) + '\n    ' + entry + text.slice(pos);
}
function insertBeforeProducer(text, beforeName, entry){
  let i = text.indexOf("name: '"+beforeName+"'");
  if(i<0) i = text.indexOf('name: "'+beforeName+'"');
  if(i<0) return null;
  const ls = text.lastIndexOf('\n', i)+1;
  return text.slice(0,ls) + '    ' + entry + '\n' + text.slice(ls);
}
const J = v => JSON.stringify(v);

/* ---------- 프로듀서 추가 ---------- */
$('#p-role').onchange = e => $('#p-role-custom').classList.toggle('hide', e.target.value!=='__custom');
$('#p-submit').onclick = async () => {
  const name = $('#p-name').value.trim();
  let role = $('#p-role').value; if(role==='__custom') role = $('#p-role-custom').value.trim();
  const ko = $('#p-ko').value.trim();
  const insta = $('#p-insta').value.trim();
  const file = $('#p-photo').files[0];
  const pos = $('#p-pos').value;
  if(!name || !role || !file){ setMsg('#p-msg','err','이름 · 역할 · 사진은 필수입니다.'); return; }
  $('#p-submit').disabled=true; setMsg('#p-msg','', '<span class="spin"></span>추가하는 중…');
  try{
    const b64 = await resizeImage(file);
    const fn = (slug(name) || ('p'+Date.now())) + '.jpg';
    const sd = await getFile('site/site-data.js');
    const ix = await getFile('index.html');
    const parts = [`name: ${J(name)}`, `ko: ${J(ko)}`, `role: ${J(role)}`, `photo: ${J(fn)}`];
    if(insta) parts.push(`instagram: ${J(insta)}`);
    const entry = `{ ${parts.join(', ')} },`;
    let newSd = pos!=='__end' ? insertBeforeProducer(sd.text, pos, entry) : null;
    if(!newSd) newSd = insertAtArrayEnd(sd.text, 'producers', entry);
    await commitFiles([
      { path:`site/img/${fn}`, content:b64, encoding:'base64' },
      { path:'site/site-data.js', content:newSd, encoding:'utf-8' },
      { path:'index.html', content:bumpVersion(ix.text), encoding:'utf-8' },
    ], `add producer: ${name}`);
    setMsg('#p-msg','ok', `추가됨 — ${name}. 약 1분 뒤 사이트에 반영됩니다.`);
    ['#p-name','#p-ko','#p-insta'].forEach(s=>$(s).value=''); pDrop.clear();
    loadRoster();
  }catch(e){ setMsg('#p-msg','err','실패: '+e.message); }
  finally{ $('#p-submit').disabled=false; }
};

/* ---------- 음원 추가 ---------- */
$('#s-submit').onclick = async () => {
  const artist=$('#s-artist').value.trim(), title=$('#s-title').value.trim(), album=$('#s-album').value.trim();
  const credits=[...document.querySelectorAll('[data-pane="song"] .chip input:checked')].map(c=>c.value);
  const cover=$('#s-cover').files[0]; let preview=$('#s-preview').value.trim();
  if(!artist||!title||!album||!credits.length){ setMsg('#s-msg','err','아티스트 · 제목 · 앨범 · 크레딧은 필수입니다.'); return; }
  $('#s-submit').disabled=true; setMsg('#s-msg','', '<span class="spin"></span>추가하는 중…');
  try{
    if(!preview){ const f=await findPreview(true); if(f) preview=f.preview; }
    const files=[]; let coverName='';
    if(cover){ const b64=await resizeImage(cover,1000,0.9); coverName=(slug(artist+'-'+title)||('cover'+Date.now()))+'.jpg'; files.push({ path:`site/img/covers/${coverName}`, content:b64, encoding:'base64' }); }
    const sd = await getFile('site/site-data.js');
    const ix = await getFile('index.html');
    const parts=[`artist: ${J(artist)}`, `title: ${J(title)}`, `album: ${J(album)}`, `credit: [${credits.map(J).join(', ')}]`];
    if(coverName) parts.push(`cover: ${J('covers/'+coverName)}`);
    if(preview) parts.push(`preview: ${J(preview)}`);
    const entry = `{ ${parts.join(', ')} },`;
    const newSd = insertAtArrayEnd(sd.text, 'songs', entry);
    files.push({ path:'site/site-data.js', content:newSd, encoding:'utf-8' });
    files.push({ path:'index.html', content:bumpVersion(ix.text), encoding:'utf-8' });
    await commitFiles(files, `add song: ${artist} - ${title}`);
    setMsg('#s-msg','ok', `추가됨 — ${artist} · ${title}. 약 1분 뒤 반영됩니다.`);
    ['#s-artist','#s-title','#s-album','#s-preview'].forEach(s=>$(s).value=''); sDrop.clear();
    $('#s-cands').classList.add('hide'); $('#s-cands').innerHTML=''; $('#s-find-msg').textContent='';
    document.querySelectorAll('[data-pane="song"] .chip input').forEach(c=>c.checked=false);
  }catch(e){ setMsg('#s-msg','err','실패: '+e.message); }
  finally{ $('#s-submit').disabled=false; }
};

/* ---------- 음원: iTunes 미리듣기 자동 찾기 ---------- */
let sAudio=null;
async function findPreview(auto){
  const artist=$('#s-artist').value.trim(), title=$('#s-title').value.trim();
  if(!artist||!title){ if(!auto) $('#s-find-msg').textContent='아티스트·곡 제목을 먼저 입력하세요.'; return null; }
  $('#s-find').disabled=true; $('#s-find-msg').innerHTML='<span class="spin"></span>찾는 중…';
  try{
    const d = await api('itunes', { term: artist+' '+title });
    const rs = d.results||[];
    if(!rs.length){ $('#s-find-msg').textContent='못 찾음 — URL을 직접 넣어주세요.'; $('#s-cands').classList.add('hide'); return null; }
    if(auto){ $('#s-preview').value = rs[0].preview; $('#s-find-msg').textContent='자동 선택: '+rs[0].track; return rs[0]; }
    renderCands(rs);
    $('#s-find-msg').textContent = rs.length+'개 찾음 — 맞는 걸 고르세요';
    return rs[0];
  }catch(e){ $('#s-find-msg').textContent='오류: '+e.message; return null; }
  finally{ $('#s-find').disabled=false; }
}
function renderCands(rs){
  const box=$('#s-cands'); box.classList.remove('hide');
  box.innerHTML = rs.map(r=>`<div class="cand"><button type="button" class="cand-play" data-url="${esc(r.preview)}">▶</button><div class="cand-info"><div class="cand-track">${esc(r.track)}</div><div class="cand-sub">${esc(r.artist)} · ${esc(r.album)}</div></div><button type="button" class="cand-pick" data-url="${esc(r.preview)}">선택</button></div>`).join('');
  box.querySelectorAll('.cand-pick').forEach(b=>b.onclick=()=>{
    $('#s-preview').value=b.dataset.url;
    box.querySelectorAll('.cand').forEach(c=>c.classList.remove('sel'));
    b.closest('.cand').classList.add('sel');
    $('#s-find-msg').textContent='선택됨 ✓';
  });
  box.querySelectorAll('.cand-play').forEach(b=>b.onclick=()=>{
    try{ if(sAudio) sAudio.pause(); sAudio=new Audio(b.dataset.url); sAudio.play().catch(()=>{}); }catch(e){}
  });
  const first=box.querySelector('.cand'); if(first){ first.classList.add('sel'); $('#s-preview').value=first.querySelector('.cand-pick').dataset.url; }
}
$('#s-find').onclick = () => findPreview(false);

/* ---------- 목록 + 위치 선택 ---------- */
let producersCache=[];
function parseList(text, key, rx){
  const si=text.indexOf(key+':'); const rest=text.slice(si);
  const end=rest.search(/\n[ \t]*\],/); const block=rest.slice(0,end);
  const out=[]; let m; while((m=rx.exec(block))) out.push(m);
  return out;
}
async function loadRoster(){
  try{
    const sd = await getFile('site/site-data.js');
    const prod = parseList(sd.text,'producers', /\{ name: ['"](.*?)['"][^\n]*?role: ['"](.*?)['"]/g);
    producersCache = prod.map(m=>({name:m[1],role:m[2]}));
    // 위치 드롭다운 채우기
    const sel=$('#p-pos'); sel.innerHTML='<option value="__end">맨 끝에 추가</option>';
    producersCache.forEach(p=>{ const o=document.createElement('option'); o.value=p.name; o.textContent=`"${p.name}" 앞에`; sel.appendChild(o); });
  }catch(e){}
}
async function loadList(){
  $('#list-body').innerHTML='<span class="note">불러오는 중…</span>';
  try{
    const sd = await getFile('site/site-data.js');
    const prod = parseList(sd.text,'producers', /\{ name: ['"](.*?)['"][^\n]*?role: ['"](.*?)['"]/g);
    const songs = parseList(sd.text,'songs', /\{ artist: ['"](.*?)['"][^\n]*?title: ['"](.*?)['"]/g);
    let h = `<div class="note" style="margin-bottom:8px">ROSTER ${prod.length}</div>`;
    prod.forEach(m=>h+=`<div class="list-item">${esc(m[1])}<span class="r">${esc(m[2])}</span></div>`);
    h += `<div class="note" style="margin:18px 0 8px">DISCOGRAPHY ${songs.length}</div>`;
    songs.forEach(m=>h+=`<div class="list-item">${esc(m[2])}<span class="r">${esc(m[1])}</span></div>`);
    $('#list-body').innerHTML=h;
  }catch(e){ $('#list-body').innerHTML=`<span class="msg err">목록 실패: ${esc(e.message)}</span>`; }
}
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('#list-reload').onclick = loadList;

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on', x===b));
  const t=b.dataset.tab;
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('hide', p.dataset.pane!==t));

/* ---------- 파일 입력: 클릭 · 드래그&드롭 · Ctrl+V ---------- */
function setupDropzone(zoneId, inputId){
  const zone=$('#'+zoneId), input=$('#'+inputId);
  const prompt=zone.querySelector('.drop-prompt'), pv=zone.querySelector('.drop-preview');
  let url='';
  function render(file){
    if(url) URL.revokeObjectURL(url);
    url=URL.createObjectURL(file);
    pv.innerHTML=`<img src="${url}" alt=""><div><div class="pv-name">${esc(file.name||'붙여넣은 이미지')}</div><div class="pv-sub">${Math.max(1,Math.round(file.size/1024))} KB · 클릭하면 변경</div></div><button type="button" class="link pv-del">제거</button>`;
    prompt.classList.add('hide'); pv.classList.remove('hide');
    pv.querySelector('.pv-del').addEventListener('click', e=>{ e.stopPropagation(); clear(); });
  }
  function clear(){ if(url){ URL.revokeObjectURL(url); url=''; } input.value=''; pv.innerHTML=''; pv.classList.add('hide'); prompt.classList.remove('hide'); }
  function setFile(file){ if(!file||!file.type.startsWith('image/')) return false; const dt=new DataTransfer(); dt.items.add(file); input.files=dt.files; render(file); return true; }
  zone.addEventListener('click', ()=> input.click());
  input.addEventListener('change', ()=>{ if(input.files[0]) render(input.files[0]); });
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev, e=>{ e.preventDefault(); zone.classList.add('drag'); }));
  ['dragleave','dragend'].forEach(ev=>zone.addEventListener(ev, e=>{ e.preventDefault(); zone.classList.remove('drag'); }));
  zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f) setFile(f); });
  return { setFile, clear };
}
const pDrop = setupDropzone('p-drop','p-photo');
const sDrop = setupDropzone('s-drop','s-cover');
document.addEventListener('paste', e=>{
  if($('#app').classList.contains('hide')) return;
  const items = e.clipboardData && e.clipboardData.items; if(!items) return;
  let file=null;
  for(const it of items){ if(it.kind==='file' && it.type && it.type.startsWith('image/')){ file=it.getAsFile(); break; } }
  if(!file) return;
  const onBtn=document.querySelector('.tabs button.on'); const tab=onBtn?onBtn.dataset.tab:'';
  if(tab==='producer'){ e.preventDefault(); pDrop.setFile(file); }
  else if(tab==='song'){ e.preventDefault(); sDrop.setFile(file); }
});

function showApp(){
  $('#app').classList.remove('hide');
  $('#repo-state').textContent = 'double-level.com';
  loadRoster();
}
